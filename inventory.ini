[master]
k8s-master1 ansible_host=127.0.0.1 ansible_port=2222

[worker1]
k8s-worker1 ansible_host=127.0.0.1 ansible_port=2223

[master:vars]
ansible_ssh_private_key_file=~/.ssh/master_key

[worker1:vars]
ansible_ssh_private_key_file=~/.ssh/worker1_key

[all:vars]
ansible_user=vagrant
ansible_ssh_common_args='-o StrictHostKeyChecking=no'